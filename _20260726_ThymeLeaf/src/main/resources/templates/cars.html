<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cars Manager</title>
<!--    <link rel="stylesheet" href="cars.css" />  -->
    <link rel="stylesheet" type="text/css" href="cars.css"/>

    <h2>Autó felvétele:</h2>
    <form th:action="@{/addCar}" th:method="post">
        <label>Típus:
            <input type="text" name="type">
        </label>
        <label>Sebesség:
            <input type="number" name="speed">
        </label>
        <label>Szín:
            <input type="text" name="color">
        </label>
        <label>Hibrid?
            <input type="checkbox" name="hibrid">
        </label>
        <label>Mérete?
            <select name="size">
                <option th:each="size : ${sizes}" th:value="${size}" th:text="${size}"></option>
            </select>
            <!--
                        <select name="size">
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="big">big</option>
                        </select>
            -->
            <label>Tud repülni? </label>
            <label>Igen:
                <input th:radiogroup="canFly" type="radio" name="canFly" th:value="true">
            </label>
            <label>Nem:
                <input th:radiogroup="canFly" type="radio" name="canFly" th:value="false">
            </label>
        </label>
        <button type="submit">Hozzáad</button>
    </form>

    <h2 th:if="${cars.size() == 0}"> No cars found! </h2>
    <table th:unless="${cars.size() == 0}">
        <tr>
            <th>Type</th>
            <th>Speed</th>
            <th>Color</th>
            <th>IsHibrid</th>
            <th>Size</th>
            <th>CanFly</th>
        </tr>
        <tr th:each="car : ${cars}">
            <td th:text="${car.type}"></td>
            <td th:text="${car.speed}"></td>
            <td th:text="${car.color}"></td>
<!--            <td th:text="${car.isHibrid}"></td>  -->
            <td><input disabled type="checkbox" th:checked="${car.isHibrid}"></td>
            <td th:text="${car.size}"></td>
            <td><input disabled type="checkbox" th:checked="${car.canFly}"></td>
        </tr>
    </table>

<!--
Az OGNL (Object-Graph Navigation Language) egy nyílt forráskódú,
Java-alapú kifejezésnyelv (Expression Language).
A legfőbb feladata, hogy egyszerű, rövid szöveges kifejezésekkel
lehessen adatokat lekérni és módosítani bonyolult
Java objektum-struktúrákból (objektum-gráfokból),
anélkül, hogy hosszú Java kódokat kellene írni.

A Thymeleaf keretrendszerben az OGNL-szerű szintaxist
a Standard Expression Language biztosítja (pld. th:text, th:each)
-->
